<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Filter Booth 자재체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F2; --surface:#FFFFFF; --ink:#1B2428; --sub:#5F6E75; --line:#D5DCDF;
  --accent:#C8283F; --accent-ink:#FFFFFF; --ok:#17794F; --ok-bg:#E2F3EA;
  --warn:#9A5B00; --warn-bg:#FBEBCF; --set-bg:#E4EAEE; --bar:#CBD4D8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141A1D; --surface:#1E2629; --ink:#E8EDEF; --sub:#98A8AF; --line:#33414A;
    --accent:#F0546B; --accent-ink:#1A0A0D; --ok:#5ED19A; --ok-bg:#16342A;
    --warn:#F2B661; --warn-bg:#3B2E14; --set-bg:#252F34; --bar:#33414A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141A1D; --surface:#1E2629; --ink:#E8EDEF; --sub:#98A8AF; --line:#33414A;
  --accent:#F0546B; --accent-ink:#1A0A0D; --ok:#5ED19A; --ok-bg:#16342A;
  --warn:#F2B661; --warn-bg:#3B2E14; --set-bg:#252F34; --bar:#33414A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.count{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.bar{height:8px;background:var(--bar);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.search:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{padding:10px 12px 90px;max-width:720px;margin:0 auto}
.group{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h2{font-size:15px;margin:0;font-weight:700}
.group span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.item.set{background:var(--set-bg)}
.item.done{border-left-color:var(--ok)}
.item.part{border-left-color:var(--warn)}
.name{font-weight:600;word-break:break-word}
.meta{font-size:12.5px;color:var(--sub);word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;border-radius:4px;padding:1px 6px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.tag.rem{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.lv{color:var(--ink)}
.ctl{display:flex;align-items:center;gap:6px;align-self:center}
.ctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation}
.ctl button:active{background:var(--bg)}
.qty{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.qty small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.full{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
.full button.all{flex:1;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.item.done .full button.all{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.full input{flex:2;min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:20}
footer button{flex:1;max-width:240px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
footer button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(92vw,560px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog textarea{width:100%;height:46vh;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px}
dialog .row{display:flex;gap:8px;margin-top:10px}
dialog button{flex:1;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.src{font-size:12px;color:var(--sub);text-align:center;margin-top:16px}
</style>
</head>
<body>
<header>
  <div class="title"><h1>Paper Filter Booth 자재체크</h1><div class="count" id="count">0 / 0</div></div>
  <div class="bar"><i id="barfill"></i></div>
  <input class="search" id="q" type="search" placeholder="이름, 파트번호, 재질 검색" aria-label="검색">
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>
<footer>
  <button id="btnShort">부족분 내보내기</button>
  <button id="btnReset" class="primary">초기화</button>
</footer>
<dialog id="dlg">
  <strong id="dlgTitle">부족분 목록</strong>
  <textarea id="dlgText" readonly></textarea>
  <div class="row"><button id="dlgCopy">복사</button><button id="dlgClose">닫기</button></div>
</dialog>

<script>
// 컬럼: [NC, Level, Part No., 구분(M=제작/I=기본), Category, Name, Spec, Material, Total, Remarks, 그룹]

const REM = "Recycling existing products / (뒷부분 잘림)";
const RAW = [
[1,"1","P00212289","SIDE","PART","Paper Filter Booth NEW Side-B","AL6061","AL6061",1,"",G1],

[11,"3.5.3","P00210543","","PURCHASE","Z-SLIDE HOOKS","HFCFS6","HFCFS6",6,"",G2],

[13,"3.5.5","P00205400","","PURCHASE","Z-CURTAIN HOLDER","HFCFC","HFCFC",4,"",G2],
[14,"3.5.6","P00203740","","PURCHASE","Z-BYCP-94","기본","기본",2,"",G2],
[15,"3.5.7","P00207541","","PURCHASE","Z-CURTAIN","HPEDC8-H1800-W1000","HPEDC8-H1800-W1000",2,"",G2],
[16,"3.5.8","P00207227","","PART","MAGNET CATCH","SS400","SS400",3,"",G2],
[17,"3.5.9","P00162442","","PURCHASING","Z-D40A-1C2-D40A-1C","PVC","PVC",2,"",G2],
[18,"3.5.10","P00211846","","PART","Sensor BKT_B","PP-N","PP-N",2,"",G2],
[19,"3.5.11","P00207353","","PART","Sensor BKT_A_MIR","Gray PVC","Gray PVC",1,"",G2],
[20,"3.5.12","P00205398","","PART","A501Curtain_B","AL6061","AL6061",1,"",G2],
[21,"3.6","P00207550","","PART","MAGNET PLATE","SS400","SS400",2,"",G2],
[22,"3.7","A00085166","","SET","A501B BOOTH FRONT DOOR ASSY","","",1,"",G2],
[23,"3.7.1","P00205389","","PART","A501B BOOTH FRONT DOOR-1","AL6061","AL6061",1,"",G2],
[24,"3.7.2","P00205407","","PURCHASING","Z-UHFAP200","기본","기본",2,"",G2],
[25,"3.7.3","P00205390","","PART","A501B BOOTH FRONT DOOR-2","AL6061","AL6061",1,"",G2],
[26,"3.7.4","P00205405","","PURCHASING","Z-BYHEA6070-41SL","기본","기본",8,"",G2],
[27,"4","P00203740","","PURCHASING","Z-BYCP-94","기본","기본",6,"",G3],
[28,"5","P00212300","","PART","Paper Filter Booth NEW Profile BK","PP-W","PP-W",8,"",G3],
[29,"6","P00212288","","PART","Paper Filter Booth NEW Side-A","AL6061","AL6061",1,"",G3],
[30,"7","P00212265","","PART","Plate Bracket-407575","SUS304","SUS304",80,"",G3],
[31,"8","A00085170","","SET","Paper Filer Booth Front Asm","","",2,REM,G4],
[32,"8.1","A00085167","","SET","A501B BOOTH RIGHT DOOR ASSY","","",1,"",G4],
[33,"8.1.1","P00205405","","PURCHASING","Z-BYHEA6070-41SL","기본","기본",16,"",G4],
[34,"8.1.2","P00205393","","PART","A501B BOOTH RIGHT DOOR-1","AL6061","AL6061",2,"",G4],
[35,"8.1.3","P00205407","","PURCHASING","Z-UHFAP200","기본","기본",4,"",G4],
[36,"8.1.4","P00205394","","PART","A501B BOOTH RIGHT DOOR-2","AL6061","AL6061",2,"",G4],
[37,"8.2","P00203740","","PURCHASING","Z-BYCP-94","기본","기본",2,"",G4],
[38,"8.3","P00207549","","PURCHASE","Z-MAGNET CATCH","BY3-3030-15","BY3-3030-15",2,"",G4],
[39,"8.4","P00205395","","PART","A501B BOOTH RIGHT","AL6061","AL6061",1,"",G4],
[40,"8.5","P00207526","","PART","Profile Docking BKT-2","SUS304_Both Polish","SUS304_Both Polish",8,"",G4],
[41,"8.6","A00085171","","SET","Paper Filter Booth Front Door","","",1,"",G4],
[42,"8.6.1","P00211846","","PART","Sensor BKT_B","PP-N","PP-N",2,"",G4],
[43,"8.6.2","P00207353","","PART","Sensor BKT_A_MIR","Gray PVC","Gray PVC",1,"",G4],
[44,"8.6.3","P00203740","","PURCHASING","Z-BYCP-94","기본","기본",2,"",G4],
[45,"8.6.4","P00205399","","PART","A501Curtain_B","AL6061","AL6061",1,"",G4],
[46,"8.6.5","P00210543","","PURCHASING","Z-SLIDE HOOKS","HFCFS6","HFCFS6",10,"",G4],
[47,"8.6.6","P00162442","","PURCHASING","Z-D40A-1C2-D40A-1C","PVC","PVC",2,"",G4],
[48,"8.6.7","P00207351","","PART","Sensor BKT_A","Gray PVC","Gray PVC",1,"",G4],
[49,"8.6.8","P00205400","","PURCHASE","Z-CURTAIN HOLDER","HFCFC","HFCFC",8,"",G4],
[50,"8.6.9","P00196978","","PURCHASING","Z-HRLCS5","실리콘","실리콘",4,"",G4],
[51,"8.6.10","P00207541","","PURCHASING","Z-CURTAIN","HPEDC8-H1800-W1000","HPEDC8-H1800-W1000",2,"",G4],
[52,"8.6.11","P00207227","","PART","MAGNET CATCH","SS400","SS400",3,"",G4],
[53,"8.6.12","P00029663","","PURCHASE","Z-BY3-1-4","SUS304","SUS304",3,"",G4],
[54,"8.7","P00210580","","PART","MAGNET PLATE","SS400","SS400",2,"",G4],
[55,"9","P00068878","","PURCHASE","Z-BRACKET_YKBK_DC_G40x40","","",46,"",G5],
[56,"10","P00212299","","PART","Paper Filter Booth NEW 4080 1750L","AL6061","AL6061",8,"",G5],
[57,"11","P00212287","","PART","Paper Filter Booth NEW Front-A","AL6061","AL6061",1,"",G5],
[58,"12","P00207560","","PART","BOOTH FOOT BASE","AL6061","AL6061",11,"",G5],
[59,"13","P00193076","","PURCHASING","Z-MALR16-150-Φ60","기본","기본",11,"",G5],
[60,"14","B00001809","","PURCHASING","T NUT M6(406)","SUS","SUS",500,"For on-site assembly",G5],
[61,"15","B00000016","","PURCHASING","렌지볼트 M6*20L, SUS304","SUS304","SUS304",500,"For on-site assembly",G5],
[62,"16","B00000522","","PURCHASING","SPRING WASHER M6, SUS304","SUS304","SUS304",500,"For on-site assembly",G5],
[63,"17","B00000674","","PURCHASING","평 와샤 M6, SUS304","SUS304","SUS304",500,"For on-site assembly",G5]
];
RAW[0][3] = ""; // 첫 행 구분 표시 정리

const ITEMS = RAW.map(r => ({nc:r[0], lv:r[1], pn:r[2], mk:r[3], cat:r[4].replace("PURCHASING","PURCHASE").replace("PURCHASE","PURCHASE"), name:r[5], spec:r[6], mat:r[7], total:r[8], rem:r[9], grp:r[10]}));
const KEY = "paper-filter-booth-check-v1";
let state = {};      // nc -> {n:확인수량, memo:string}
let filter = "all", query = "";

try { const s = localStorage.getItem(KEY); if (s) state = JSON.parse(s) || {}; } catch(e) { state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function get(nc){ return state[nc] || (state[nc] = {n:0, memo:""}); }
function status(it){ const n = get(it.nc).n; return n >= it.total ? "done" : n > 0 ? "part" : "todo"; }

const FILTERS = [["all","전체"],["todo","미확인"],["part","일부"],["done","완료"],["PART","PART"],["PURCHASE","PURCHASE"],["SET","SET"]];
const chips = document.getElementById("chips");
FILTERS.forEach(([k,l]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = l; b.dataset.k = k; b.setAttribute("aria-pressed", k === filter);
  b.onclick = () => { filter = k; [...chips.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.k === k)); render(); };
  chips.appendChild(b);
});
document.getElementById("q").oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

function match(it){
  if (filter === "todo" || filter === "part" || filter === "done") { if (status(it) !== filter) return false; }
  else if (filter !== "all" && it.cat !== filter) return false;
  if (!query) return true;
  return (it.name + " " + it.pn + " " + it.mat + " " + it.spec + " " + it.lv).toLowerCase().includes(query);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const list = document.getElementById("list");
  const doneCount = ITEMS.filter(i => status(i) === "done").length;
  document.getElementById("count").textContent = doneCount + " / " + ITEMS.length + " 완료";
  document.getElementById("barfill").style.width = (doneCount / ITEMS.length * 100) + "%";
  let html = "", last = "", shown = 0;
  const groups = {};
  ITEMS.forEach(i => { (groups[i.grp] = groups[i.grp] || []).push(i); });
  for (const g of Object.keys(groups)) {
    const rows = groups[g].filter(match);
    if (!rows.length) continue;
    const gd = groups[g].filter(i => status(i) === "done").length;
    html += '<div class="group"><h2>' + esc(g) + '</h2><span>' + gd + ' / ' + groups[g].length + '</span></div>';
    rows.forEach(it => {
      shown++;
      const st = status(it), s = get(it.nc);
      html += '<div class="item ' + (it.cat === "SET" ? "set " : "") + st + '" data-nc="' + it.nc + '">' +
        '<div><div class="name">' + esc(it.name) + '</div>' +
        '<div class="meta">' + esc(it.pn) + (it.spec ? ' · ' + esc(it.spec) : '') + '</div>' +
        '<div class="tags"><span class="tag lv">Lv ' + esc(it.lv) + '</span><span class="tag">' + it.cat + '</span>' +
        (it.mat && it.mat !== it.spec ? '<span class="tag">' + esc(it.mat) + '</span>' : '') +
        (it.rem ? '<span class="tag rem">' + esc(it.rem) + '</span>' : '') + '</div></div>' +
        '<div class="ctl"><button data-a="dec" aria-label="수량 줄이기">−</button>' +
        '<div class="qty">' + s.n + '<small>/ ' + it.total + '</small></div>' +
        '<button data-a="inc" aria-label="수량 늘리기">+</button></div>' +
        '<div class="full"><button class="all" data-a="all">' + (st === "done" ? "확인 완료 (탭하면 해제)" : "전체 확인") + '</button>' +
        '<input type="text" data-a="memo" placeholder="메모 (불량, 입고 예정 등)" value="' + esc(s.memo) + '"></div></div>';
    });
  }
  list.innerHTML = html || '<div class="empty">조건에 맞는 자재가 없습니다. 필터나 검색어를 바꿔 보세요.</div>';
  if (html) list.insertAdjacentHTML("beforeend", '<div class="src">출처: 참고 / Reference 22–23쪽 사진 (NC 1–63)</div>');
}

document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const card = b.closest(".item"); const it = ITEMS.find(i => i.nc == card.dataset.nc); const s = get(it.nc);
  const a = b.dataset.a;
  if (a === "inc") s.n = Math.min(it.total * 2, s.n + 1);
  if (a === "dec") s.n = Math.max(0, s.n - 1);
  if (a === "all") s.n = s.n >= it.total ? 0 : it.total;
  save(); render();
});
document.getElementById("list").addEventListener("change", e => {
  if (e.target.dataset.a !== "memo") return;
  const nc = e.target.closest(".item").dataset.nc; get(nc).memo = e.target.value; save();
});

// 부족분 내보내기
const dlg = document.getElementById("dlg"), dlgText = document.getElementById("dlgText");
document.getElementById("btnShort").onclick = () => {
  const lines = ITEMS.filter(i => get(i.nc).n < i.total && i.cat !== "SET").map(i => {
    const s = get(i.nc);
    return "NC" + i.nc + " | " + i.pn + " | " + i.name + (i.spec ? " (" + i.spec + ")" : "") + " | 필요 " + i.total + " / 확인 " + s.n + " / 부족 " + (i.total - s.n) + (s.memo ? " | " + s.memo : "");
  });
  document.getElementById("dlgTitle").textContent = "부족분 " + lines.length + "건 (SET 제외)";
  dlgText.value = lines.length ? lines.join("\n") : "부족한 자재가 없습니다.";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
};
document.getElementById("dlgClose").onclick = () => dlg.close ? dlg.close() : dlg.removeAttribute("open");
document.getElementById("dlgCopy").onclick = async () => {
  const btn = document.getElementById("dlgCopy");
  try { await navigator.clipboard.writeText(dlgText.value); btn.textContent = "복사됨"; }
  catch(e) { dlgText.select(); btn.textContent = "텍스트를 길게 눌러 복사"; }
  setTimeout(() => btn.textContent = "복사", 1800);
};

// 초기화 (두 번 탭 확인)
const rb = document.getElementById("btnReset"); let armed = false, t;
rb.onclick = () => {
  if (!armed) { armed = true; rb.textContent = "한 번 더 누르면 초기화"; t = setTimeout(() => { armed = false; rb.textContent = "초기화"; }, 3000); return; }
  clearTimeout(t); armed = false; rb.textContent = "초기화"; state = {}; save(); render();
};
render();
</script>
</body>
